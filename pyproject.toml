[project]
name = "autodocs"
version = "0.1.0"
description = "AutoDocs: an agent that documents a finished branch (built session by session)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-genai==3.3.0",
    "pydantic==2.14.3",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autodocs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::SyntaxWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
