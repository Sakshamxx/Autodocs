[project]
name = "autodocs"
version = "0.1.0"
description = "AutoDocs: an agent that documents a finished branch (built session by session)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask==3.1.3",
    "google-genai==3.3.0",
    "gunicorn==27.0.1",
    "httpx2==2.16.0",  # the SDK's HTTP client; imported for its timeout error
    "langchain==1.5.0",
    "langchain-core==1.8.0",
    "langchain-google-genai==4.5.0",
    "langfuse==5.2.0",
    "langgraph==1.2.22",
    "openai==3.51.0",
    "pydantic==2.14.3",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autodocs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::SyntaxWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
